# Render Blueprint for SETU: two Docker web services (API + Chainlit UI),
# both on the free plan. Apply via the Render dashboard: New -> Blueprint,
# point at this repo. See docs/DEPLOY.md for the full runbook, including the
# two-step deploy order SETU_API_URL/ALLOWED_ORIGINS require.
#
# Everything below is free-tier: neither service costs anything at rest, and
# both spin down after 15 minutes idle (see docs/DEPLOY.md).

services:
  - type: web
    name: setu-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.6-27b
      - key: JINA_API_KEY
        sync: false
      - key: AZURE_TRANSLATOR_KEY
        sync: false
      - key: AZURE_TRANSLATOR_REGION
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: setu-schemes
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
      - key: API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: setu-ui
    runtime: docker
    dockerfilePath: ./ui/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: SETU_API_URL
        sync: false
      - key: SETU_API_KEY
        sync: false
